<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | BillTrack</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0d1117; color:#e6edf3; font:16px/1.6 system-ui,sans-serif; }
    main { max-width:38rem; padding:32px; }
    h1 { font-size:1.6rem; line-height:1.3; } p { overflow-wrap:anywhere; }
    a { color:#f0a500; text-underline-offset:4px; } a:focus-visible { outline:3px solid #f0a500; outline-offset:4px; }
    .reference { color:#b8c0cc; font-size:.9rem; }
  </style>
</head>
<body><main role="alert" aria-labelledby="error-title">
  <p>BillTrack</p><h1 id="error-title">{{ title }}</h1>
  <p>{{ message }}</p><p class="reference">Reference: {{ reference }}</p>
  <a href="/">Back to BillTrack</a>
</main></body></html>
